# CI for the mycnv kumodev port (plan D24: developed and CI-tested in this repo, moved to bayer-int for production).
# Public tests only: tests/data/restricted/ (patient-derived, git-ignored) never exists in CI, so those tests skip.
name: ci

on:
  push:
    branches: [kumodev]
  pull_request:
    branches: [kumodev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: mycnv
          cache-environment: true
      - name: Install the package (non-editable, so missing package data shows up)
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -rs tests

  docker-test-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build --target test (runs the public suite inside the build env)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the runtime image (last stage) and smoke-test it
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mycnv:ci
          platforms: linux/amd64
          cache-from: type=gha
      - name: Runtime contract (non-root, CLI, tools)
        run: >
          docker run --rm mycnv:ci bash -o pipefail -c
          'test "$(id -u)" != 0 && mycnv --version && mycnv tracks gc --help >/dev/null &&
          mawk -W version | sed -n 1p && samtools --version | sed -n 1p && genmap --version-check 0 --version | sed -n 1p &&
          ps -o rss= -p $$ && ! command -v pip && ! python -c "import pip" 2>/dev/null'
      # sed -n 1p reads all input: `| head -1` under pipefail failed with SIGPIPE (exit 141) when a tool was still
      # writing after head exited (run 45291859460).
      - name: Tier-A fixture smoke in the runtime image (image user, then an arbitrary uid)
        run: |
          docker run --rm -v "$PWD/tests/data/plumbing:/data:ro" -v "$PWD/tests/smoke:/smoke:ro" \
            mycnv:ci bash /smoke/smoke_mycnv.sh /data
          docker run --rm --user 4242:4242 -v "$PWD/tests/data/plumbing:/data:ro" -v "$PWD/tests/smoke:/smoke:ro" \
            mycnv:ci bash /smoke/smoke_mycnv.sh /data
      - name: Image size (image list, exact bytes, per layer, /opt/conda inside the container)
        run: |
          docker image ls mycnv:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker image inspect --format 'inspect .Size: {{.Size}} bytes' mycnv:ci
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' mycnv:ci | cut -c1-160
          docker run --rm mycnv:ci du -sh /opt/conda /usr /var
      # Trivy 0.69.3 (the kumo-docker-scientific CI version) as a container; the vuln DB is cached in a volume for
      # the three scans of this job. Gate = library packages, fixed vulns only, HIGH/CRITICAL. Accepted findings go
      # into .trivyignore with a reason (plan 3b/D24).
      - name: Trivy Dockerfile config scan (HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.69.3 \
            config --severity HIGH,CRITICAL --exit-code 1 Dockerfile
      - name: Trivy vulnerability gate (library packages, fixed only, HIGH/CRITICAL)
        run: |
          ignore=()
          if [ -f .trivyignore ]; then ignore=(--ignorefile /src/.trivyignore); fi
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/src:ro \
            -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.69.3 \
            image --scanners vuln --pkg-types library --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            "${ignore[@]}" mycnv:ci
      - name: Trivy report incl. OS packages (informational, never fails)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.69.3 image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 mycnv:ci
