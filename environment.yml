# mycnv runtime + test env (unpinned; the solver picks current versions, plan D18).
# Used by the Dockerfile (micromamba install -n base -f environment.yml) and for local CI-like checks:
#   conda env create -f environment.yml -n mycnv-ci
#   conda run -n mycnv-ci python -m pip install --no-deps --no-build-isolation .
#   conda run -n mycnv-ci python -m pytest -q
# Not included: scikit-learn (only mycnv.cluster, the GMM-caller groundwork) and Jupyter; the workbench env
# `somvar` (/home/GOFQR/repos/somvar/envs/somvar.yml) has both.
name: mycnv
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python
  - pip
  - setuptools
  - numpy
  - pandas
  - pyyaml
  - matplotlib-base  # plots only (--plots); imported lazily
  - mawk          # mawk 1.3.4 (bioconda); the tools need mawk and bash, not gawk/dash
  - pytest        # tests (workspace convention: runtime deps + pytest)
